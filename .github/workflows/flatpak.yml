name: Build Flatpak Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  flatpak:
    name: Build and Upload Flatpak
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v1
        with:
          bundle: stoat-desktop.flatpak
          manifest-path: org.stoat.Stoat.json
          app-id: chat.stoat.StoatDesktop

      - name: Upload Build Artifact (para execuções manuais)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: stoat-desktop-flatpak
          path: stoat-desktop.flatpak

      - name: Create GitHub Release (se for tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: stoat.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
